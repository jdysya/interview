name: Build and deploy interview wiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check content and local links
        run: npm run check:content
      - name: Check question anchors, diagrams and navigation
        run: npm run check:learning
      - name: Verify source-grounded article examples
        run: python3 scripts/check-source-examples.py
      - name: Compile and verify original Java solutions
        run: npm run check:algorithms
      - name: Verify added algorithms and ACM parser
        run: npm run check:extended
      - name: Run recovery, inventory, evaluation and thread pool experiments
        run: npm run check:engineering
      - name: Build wiki
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify rendered pages and assets
        run: npm run check:dist
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wiki-browser" --no-package-lock --no-save playwright@1.58.2
          "$RUNNER_TEMP/wiki-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop and mobile interactions
        run: npm run check:ui
        env:
          WIKI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wiki-browser/node_modules/playwright/index.mjs
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-ui-evidence
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vuepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
